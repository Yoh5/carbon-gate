# Le pipeline qui se mesure lui-même.
#
# Ce dépôt est un outil qui chiffre le coût carbone d'une intégration continue.
# Le brancher sur sa propre CI n'est donc pas une case cochée : c'est le
# produit qui se démontre sur son propre sujet, et l'historique de pipeline
# **est** la preuve.
#
# ## Pourquoi un pipeline enfant, et pas des `rules:`
#
# La première version gardait chaque job par une variable que la porte
# écrivait dans un artefact dotenv. Ça ne pouvait pas marcher, et il a fallu
# un pipeline VERT pour s'en apercevoir : **`rules:` est évalué à la création
# du pipeline**, avant que le moindre job ait tourné. Le dotenv arrive après —
# il sert de variable d'environnement aux jobs suivants, jamais aux règles qui
# décident de leur existence.
#
# L'observation est nette : la porte a écrit `CARBONGATE_VERIFIER_README=false`
# et le job a tourné quand même. Les six jobs passaient au vert et la décision
# de la porte n'atteignait rien. Un pipeline vert peut cacher que le produit
# entier est débranché.
#
# Donc la porte **engendre** un pipeline ne portant que les jobs retenus, et
# ce pipeline-ci le déclenche. Ce qui n'y est pas n'existe pas, et le pipeline
# enfant visible dans l'historique est exactement la liste de ce qui a été
# jugé nécessaire.
#
# ## Ce que ce pipeline ne fait pas, et c'est la règle du projet
#
# **Le carbone ne décide jamais de ce qui tourne.** La porte décide sur ce qui
# a changé ; le chiffrage vient après et ne fait que dire ce que la décision a
# épargné. `scan-securite` porte `toujours: true` dans `carbongate.json` : il
# est dans tous les pipelines engendrés, quel que soit son coût.
#
# ## Les deux réglages qui ne sont pas cosmétiques
#
# `GIT_DEPTH: 0` : sans l'historique, `git diff` ne peut pas répondre, et la
# porte bascule sur son repli — tout lancer. Sûr, mais la démonstration
# disparaît.
#
# `cache` plutôt qu'`artifacts` pour les mesures : un artefact ne survit pas
# au pipeline, et une mesure sert précisément au pipeline **suivant**.

stages: [porte, verifier, bilan]

variables:
  GIT_DEPTH: 0

# ── 1. La porte ──────────────────────────────────────────────────────────
porte:
  stage: porte
  image: python:3.12-slim
  before_script:
    # `python:3.12-slim` n'embarque pas git, et la porte en a besoin pour
    # savoir ce qui a changé. Sans lui elle bascule sur son repli.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install --quiet --upgrade pip
    - pip install --quiet -e .
  script:
    # Sur une merge request, la base est le point de divergence ; sinon, le
    # commit d'avant. Passer la mauvaise base ferait croire que tout a changé.
    # Quelle est la bonne base, et pourquoi elle dépend du contexte.
    #
    # `CI_COMMIT_BEFORE_SHA` répond à « qu'est-ce que ce push a ajouté ». Sur
    # la branche par défaut c'est exactement la question. Sur une branche de
    # travail, non : après un rebase ou un amend, l'ancien sommet n'est plus
    # un ancêtre, et le diff ramasse tout ce que la branche par défaut a
    # gagné entre-temps. Mesuré ici : un commit ne touchant que le README a
    # relancé les quatre jobs, parce que la base était le sommet d'avant le
    # rebase.
    #
    # La question qu'une branche doit poser est « qu'est-ce que CETTE branche
    # change », et la réponse est le point de fourche — `merge-base`.
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        # GitLab a déjà calculé le point de divergence exact de la MR.
        BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        echo "merge request : base fournie par GitLab"
      elif [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]            && [ -n "$CI_COMMIT_BEFORE_SHA" ]            && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        BASE="$CI_COMMIT_BEFORE_SHA"
        echo "branche par defaut : on compare au push precedent"
      else
        git fetch --quiet origin "$CI_DEFAULT_BRANCH"
        BASE="$(git merge-base FETCH_HEAD HEAD)"
        echo "branche de travail : on compare au point de fourche avec $CI_DEFAULT_BRANCH"
      fi
    - echo "base de comparaison - $BASE"
    - python -m carbongate decide --depuis "$BASE" --env carbongate.env --pipeline-gitlab retenu.yml
    - echo "--- le pipeline engendre ---"
    - cat retenu.yml
  artifacts:
    paths: [retenu.yml, carbongate.env]
    expire_in: 1 week

# ── 2. Ce que la porte a retenu, et rien d'autre ─────────────────────────
retenu:
  stage: verifier
  needs: [porte]
  trigger:
    include:
      - artifact: retenu.yml
        job: porte
    # `depend` : le parent échoue si l'enfant échoue. Sans ça, un test rouge
    # dans l'enfant laisserait le parent au vert — exactement le genre de vert
    # qu'on vient de passer la journée à démonter.
    strategy: depend

# ── 3. Le bilan ──────────────────────────────────────────────────────────
bilan:
  stage: bilan
  when: always
  needs: [porte]
  image: python:3.12-slim
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet -e .
  cache:
    key: "carbongate-mesures-$CI_COMMIT_REF_SLUG"
    paths: [carbongate-mesures.json]
  script:
    # Le rapport imprime toujours ses sources et ses réserves : un bilan qui
    # ne cite pas ses coefficients n'est pas vérifiable, et un bilan dont on
    # ignore la couverture n'est pas un bilan.
    - python -m carbongate rapport
  artifacts:
    paths: [carbongate-mesures.json]
    expire_in: 1 month
