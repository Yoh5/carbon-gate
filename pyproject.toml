[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbongate"
version = "0.1.0"
description = "Un pipeline CI qui mesure son coût carbone et refuse d'annoncer une économie qu'il ne peut pas prouver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Axel AHO" }]
# Aucune dépendance d'exécution, et c'est un choix : la sonde est /proc et
# ctypes, le calcul est de l'arithmétique, le rapport est du texte. Un outil
# qui mesure une empreinte n'a pas à en ajouter une en s'installant.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
carbongate = "carbongate.__main__:main"

[tool.setuptools.packages.find]
include = ["carbongate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Les lignes de ce dépôt sont écrites pour une colonne 79 : la prose des
# docstrings porte autant que le code, et elle se relit mal plus large.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Le noyau non discutable : erreurs réelles (E, W), code mort et fautes de
# nom (F), ordre des imports (I). Les familles UP et PL sont des préférences
# de style — les activer ici ferait rougir le pipeline sur des avis plutôt
# que sur des défauts, et un contrôle qu'on apprend à ignorer ne protège plus
# rien. Si on les veut un jour, on les ajoute en les corrigeant, pas en les
# subissant.
select = ["E", "W", "F", "I"]
