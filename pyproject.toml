[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbongate"
version = "0.1.0"
description = "Un pipeline CI qui mesure son coût carbone et refuse d'annoncer une économie qu'il ne peut pas prouver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Axel AHO" }]
# Aucune dépendance d'exécution, et c'est un choix : la sonde est /proc et
# ctypes, le calcul est de l'arithmétique, le rapport est du texte. Un outil
# qui mesure une empreinte n'a pas à en ajouter une en s'installant.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
carbongate = "carbongate.__main__:main"

[tool.setuptools.packages.find]
include = ["carbongate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
