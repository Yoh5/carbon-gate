# Les corps de jobs, en un seul endroit.
#
# Le pipeline enfant est **engendré** par la porte : il ne contient que les
# jobs retenus. Pour que ni la porte ni le pipeline parent n'aient à recopier
# ce que fait chaque job, les corps vivent ici en modèles cachés, et le
# fichier engendré se contente de les étendre par leur nom.
#
# C'est ce qui rend la génération sûre : `carbongate` écrit des noms, jamais
# des commandes. Un générateur qui produit du shell est un générateur qu'il
# faut relire à chaque fois.

.base:
  image: python:3.12-slim
  before_script:
    # `pip-audit` audite l'ENVIRONNEMENT, pas seulement ce projet. Un dépôt
    # sans aucune dépendance d'exécution peut donc échouer sur sa propre
    # chaîne d'outils, et c'est arrivé : l'image embarque pip 25.0.1, visé par
    # PYSEC-2026-1795, corrigé en 25.3. On met à jour plutôt que d'ignorer.
    - pip install --quiet --upgrade pip
    # `-e .` installe le paquet, pas de quoi le tester : le projet ne déclare
    # aucune dépendance d'exécution, c'est voulu, donc pytest n'en est pas une.
    - pip install --quiet -e . pytest pyyaml
  cache:
    key: "carbongate-mesures-$CI_COMMIT_REF_SLUG"
    paths: [carbongate-mesures.json]

.job-tests:
  extends: .base
  stage: verifier
  script:
    - python -m carbongate mesure --nom tests -- python -m pytest -q
  artifacts:
    paths: [carbongate-mesures.json]
    expire_in: 1 week

.job-lint:
  extends: .base
  stage: verifier
  script:
    - pip install --quiet ruff
    - python -m carbongate mesure --nom lint -- ruff check carbongate tests exemple.py

.job-verifier-readme:
  extends: .base
  stage: verifier
  script:
    # Le garde-fou du dépôt : il sort en erreur si un chiffre du README ne
    # correspond plus à ce que le code calcule.
    - python -m carbongate mesure --nom verifier-readme -- python verifier_readme.py

.job-scan-securite:
  extends: .base
  stage: verifier
  script:
    - pip install --quiet pip-audit
    - python -m carbongate mesure --nom scan-securite -- pip-audit
